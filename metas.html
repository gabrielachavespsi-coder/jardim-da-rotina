<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objetivos</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --verde-principal:#E6F2E5;
  --verde-hover:#D6EAD4;
  --verde-texto:#3F6F4F;
  --verde-escuro:#5C9D5C;

  --fundo:#F6F7F5;
  --card:#FFFFFF;

  --texto-principal:#2F2F2F;
  --texto-secundario:#6B6B6B;
  --borda:#E3E5E1;

  --fonte:'Poppins',sans-serif;

  --titulo:20px;
  --botao:15px;

  --sombra-suave:0 4px 12px rgba(0,0,0,0.05);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html, body{
  width:100%;
  min-height:100%;
}

body{
  font-family:var(--fonte);
  background:var(--fundo);
  color:var(--texto-principal);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
  overflow-y:auto;
}

.pagina{
  width:100%;
  max-width:420px;
}

.card{
  width:100%;
  background:var(--card);
  border-radius:24px;
  padding:22px 16px 18px;
  box-shadow:var(--sombra-suave);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.topo{
  display:grid;
  grid-template-columns:40px 1fr 58px;
  align-items:start;
  gap:8px;
  margin-bottom:6px;
}

.botao-voltar{
  border:none;
  background:#E9ECE7;
  color:var(--texto-principal);
  border-radius:12px;
  width:40px;
  height:40px;
  cursor:pointer;
  font-size:18px;
  font-family:var(--fonte);
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  padding:0;
  transition:0.2s ease;
}

.botao-voltar:hover{
  background:#dde3d9;
}

.botao-voltar span{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  transform:translateY(-1px);
}

.topCenter{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:0;
  padding-top:2px;
}

.titleIndex{
  color:var(--texto-principal);
  font-weight:500;
  font-size:var(--titulo);
  margin:0;
  line-height:1.2;
  text-align:center;
}

.subtitulo{
  width:100%;
  max-width:260px;
  margin:2px auto 0;
  font-size:12px;
  color:var(--texto-secundario);
  text-align:center;
  line-height:1.35;
  white-space:nowrap;
  max-width:none;
  font-size:10.5px;
}

.dataTopo{
  min-height:40px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:flex-start;
  text-align:right;
  color:var(--texto-secundario);
  line-height:1.1;
  padding-top:1px;
}

.horaTopo{
  font-size:14px;
  color:var(--verde-texto);
  font-weight:500;
  white-space:nowrap;
  margin-bottom:2px;
}

.dataTopoLinha{
  font-size:11px;
  white-space:nowrap;
}

.box{
  border-radius:16px;
  background:#F8FAF7;
  border:1px solid var(--borda);
  padding:12px;
  color:var(--texto-principal);
  line-height:1.6;
}

.listHeader{
  display:grid;
  grid-template-columns:34px 1fr 34px;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.listHeaderSpacer{
  width:38px;
  height:38px;
}

.boxTitle{
  font-size:14px;
  color:var(--verde-texto);
  text-align:center;
  margin-bottom:0;
  font-family:var(--fonte);
  font-weight:500;
}

.addBtn{
  border:none;
  background:#E9ECE7;
  color:var(--verde-texto);
  width:28px;
  height:28px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  font-family:var(--fonte);
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:0.2s ease;
}

.addBtn:hover{
  background:#dde3d9;
}

.metaList{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:12px;
}

.metaItem{
  border:none;
  width:100%;
  background:var(--verde-principal);
  border-radius:16px;
  padding:14px 16px;
  text-align:center;
  cursor:pointer;
  box-sizing:border-box;
  transition:0.2s ease;
}

.metaItem:hover{
  background:var(--verde-hover);
}

.metaNome{
  font-size:14px;
  font-family:var(--fonte);
  font-weight:500;
  color:var(--verde-texto);
  line-height:1.4;
  word-break:break-word;
}

.metaActions{
  display:none;
  margin-top:12px;
  gap:6px;
  justify-content:flex-start;
  flex-wrap:wrap;
}

.metaActions.show{
  display:flex;
}

.actionBtn{
  border:none;
  padding:6px 12px;
  min-height:28px;
  border-radius:12px;
  cursor:pointer;
  font-size:11px;
  font-family:var(--fonte);
  background:#ffffff;
  color:var(--verde-texto);
  transition:0.2s ease;
  line-height:1.1;
}

.primary{
  background:rgba(255,255,255,0.96);
  color:#2f5d3d;
}

.danger{
  background:#f5d7d7;
  color:#8a3030;
}

.empty{
  font-size:12.5px;
  color:var(--texto-secundario);
  text-align:center;
  padding:4px 0;
}

.footerMiniAction{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:4px;
  flex-wrap:wrap;
}

.futureBtn{
  border:none;
  background:#E9ECE7;
  color:var(--texto-secundario);
  border-radius:12px;
  padding:9px 14px;
  font-size:12px;
  cursor:pointer;
  font-family:var(--fonte);
  transition:0.2s ease;
}

.futureBtn:hover{
  background:#dde3d9;
  color:var(--texto-principal);
}


.actionCreateBox{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 30px;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:0.2s ease;
}
.actionCreateBox:hover{background:#F2F7F0;}
.createActionIcon{
  width:42px;height:42px;border-radius:14px;background:var(--verde-principal);
  color:var(--verde-texto);display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:500;
}
.createActionText{min-width:0;}
.actionCreateBox .boxTitle{text-align:left;}
.createActionSub{font-size:10.2px;color:var(--texto-secundario);line-height:1.25;margin-top:2px;white-space:nowrap;}
.field select{
  padding:12px 14px;border-radius:12px;border:1px solid var(--borda);
  font-size:13px;font-family:var(--fonte);outline:none;color:var(--texto-principal);background:#fff;
}
.field select:focus{border-color:var(--verde-escuro);box-shadow:0 0 0 3px rgba(127,183,126,0.12);}
.objetivoItem{
  border:1px solid rgba(63,111,79,.12);background:#F4F8F2;border-radius:16px;overflow:hidden;
}
.objetivoResumo{padding:14px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:8px;align-items:center;}
.objetivoNome{font-size:14px;font-weight:500;color:var(--verde-texto);}
.objetivoDescricao{font-size:11.5px;color:var(--texto-secundario);line-height:1.4;margin-top:3px;}
.objetivoResumoInfo{font-size:11px;color:var(--texto-secundario);line-height:1.45;margin-top:7px;}
.objetivoMetasTitulo{font-size:12.5px;font-weight:500;color:var(--verde-texto);line-height:1.35;margin:10px 2px 6px;}
.objetivoSeta{font-size:21px;color:var(--verde-texto);transition:.2s;text-align:center;}
.objetivoItem.aberto .objetivoSeta{transform:rotate(90deg);}
.objetivoConteudo{display:none;padding:0 12px 12px;}
.objetivoItem.aberto .objetivoConteudo{display:block;}
.objetivoInfo{font-size:11px;color:var(--texto-secundario);padding:10px 2px;border-top:1px solid rgba(63,111,79,.12);line-height:1.5;}
.objetivoMetas{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.objetivoMetaMini{background:var(--verde-principal);border-radius:13px;padding:10px 12px;color:var(--verde-texto);font-size:12px;line-height:1.4;}
.objetivoMetaTopo{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.objetivoMetaNome{min-width:0;flex:1;}
.objetivoMetaBtn{border:none;border-radius:10px;background:#fff;color:var(--verde-texto);font-family:var(--fonte);font-size:10.5px;padding:6px 9px;cursor:pointer;flex-shrink:0;}
.objetivoMetaBtn.reabrir{background:#F5F1E8;color:#6B665A;}
.objetivoAcoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  display:none;
  justify-content:center;
  align-items:flex-start;
  padding:16px;
  z-index:999;
  overflow-y:auto;
}

.modalOverlay.show{
  display:flex;
}

.modal{
  background:#fff;
  padding:18px;
  border-radius:20px;
  width:min(360px, 100%);
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.18);
  max-height:calc(100vh - 32px);
  overflow-y:auto;
}

.modalTitle{
  font-size:18px;
  color:var(--texto-principal);
  text-align:center;
  font-weight:500;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:13px;
  color:var(--texto-principal);
  font-family:var(--fonte);
  font-weight:500;
}

.field input,
.field textarea{
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--borda);
  font-size:13px;
  font-family:var(--fonte);
  outline:none;
  color:var(--texto-principal);
  background:#fff;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

#futurasEdicoesTexto{
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--borda);
  font-size:13px;
  font-family:var(--fonte);
  box-sizing:border-box;
  width:100%;
  height:260px;
  resize:none;
}

.field input:focus,
.field textarea:focus,
#futurasEdicoesTexto:focus{
  border-color:var(--verde-escuro);
  box-shadow:0 0 0 3px rgba(127,183,126,0.12);
}

.modalBtns{
  display:flex;
  gap:8px;
}

.modalBtns button{
  flex:1;
  padding:11px 12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-family:var(--fonte);
  font-size:12.5px;
  transition:0.2s ease;
}

.cancel{
  background:#efefef;
  color:#333;
}

.cancel:hover{
  background:#e7e7e7;
}

.save{
  background:var(--verde-escuro);
  color:white;
}

.save:hover{
  background:#4f8a4f;
}

@media (max-width: 390px){
  body{
    padding:14px;
  }

  .card{
    padding:20px 14px 16px;
  }

  .titleIndex{
    font-size:19px;
  }

  .subtitulo{
    font-size:12px;
    max-width:240px;
  }

  .topo{
    grid-template-columns:40px 1fr 54px;
  }

  .horaTopo{
    font-size:13px;
  }

  .dataTopoLinha{
    font-size:10.5px;
  }
}
</style>


<style id="ajuste-fundo-saude-metas">

body{
  align-items:flex-start !important;

    radial-gradient(circle at top left, rgba(232,243,226,.8), transparent 35%),

  border:1px solid rgba(221,232,216,.86) !important;

</style>

<style id="ajustes-edicao-exclusao">

  display:none;
  width:100%;
  min-height:42px;
  border:none;
  border-radius:12px;
  background:#F8E2E2;

}

</style>


<style id="ajustes-acoes-objetivos-metas">

.metaResumoExtra{margin-top:6px;}

.objetivoMetaMiniDescricao{font-size:11px;color:rgba(63,111,79,0.78);line-height:1.35;}
.objetivoMetaMiniInfo{font-size:10.8px;color:rgba(63,111,79,0.84);line-height:1.3;}
.objetivoMetaEditarWrap{display:none;margin-top:8px;justify-content:flex-start;}
.objetivoMetaMini.aberto .objetivoMetaEditarWrap{display:flex;}

.objetivoItem.aberto .editarObjetivoInline{display:inline-flex;align-items:center;justify-content:center;}
#btnConcluirMetaModal{display:none;width:100%;min-height:46px;border:none;border-radius:16px;background:#EAF3E8;color:#3F6F4F;font-family:var(--fonte);font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 5px 14px rgba(84,110,79,.06);}
#btnConcluirMetaModal.show{display:block;}

.modalBtns button{min-height:46px !important;border-radius:16px !important;font-size:13px !important;font-weight:500 !important;}

</style>

    <div class="field"><label for="campoObjetivoDescricao">Descrição</label><textarea id="campoObjetivoDescricao" placeholder="Escreva os detalhes do objetivo..."></textarea></div>
    <div class="field"><label for="campoObjetivoLocal">Local (se tiver)</label><input type="text" id="campoObjetivoLocal" maxlength="100" placeholder="Ex.: Casa, trabalho, online..." /></div>
    <div class="field"><label for="campoObjetivoData">Quero alcançar esse objetivo até o dia</label><input type="date" id="campoObjetivoData" /></div>
    <div class="field"><label for="campoObjetivoValor">Investimento</label><input type="text" id="campoObjetivoValor" inputmode="numeric" placeholder="R$ 0,00" /></div>
    <div class="modalFooterCompact">
      <button id="btnExcluirObjetivoModal" class="modalDeleteBtn compactDanger" type="button" onclick="excluirObjetivoEmEdicao()">Excluir</button>
      <button class="cancel" onclick="fecharModalObjetivo()">Cancelar</button>
      <button class="save" onclick="salvarObjetivo()">Salvar</button>
    </div>
  </div>
</div>

<div class="modalOverlay" id="modalMeta">
  <div class="modal">
    <h2 class="modalTitle" id="tituloModalMeta">Nova meta</h2>

    <input type="hidden" id="campoMetaIdEdicao">

    <div class="field">
      <label for="campoMetaObjetivo">Objetivo vinculado</label>
      <select id="campoMetaObjetivo"><option value="">Sem objetivo</option></select>
    </div>

    <div class="field">
      <label for="campoMetaNome">Meta</label>
      <input type="text" id="campoMetaNome" maxlength="100" placeholder="Ex.: Curso, viagem, projeto..." />
    </div>

    <div class="field">
      <label for="campoMetaDescricao">Descrição</label>
      <textarea id="campoMetaDescricao" placeholder="Escreva os detalhes da meta..."></textarea>
    </div>

    <div class="field">
      <label for="campoMetaLocal">Local (se tiver)</label>
      <input type="text" id="campoMetaLocal" maxlength="100" placeholder="Ex.: Online, casa, trabalho..." />
    </div>

    <div class="field">
      <label for="campoMetaData">Quero alcançar essa Meta até o dia</label>
      <input type="date" id="campoMetaData" />
    </div>

    <div class="field">
      <label for="campoMetaValor">Investimento</label>
      <input type="text" id="campoMetaValor" inputmode="numeric" placeholder="R$ 0,00" />
    </div>

    <div class="modalFooterCompact metaFooterCompact">
      <button id="btnConcluirMetaModal" type="button" onclick="alternarConclusaoMetaEmEdicao()">Concluir</button>
      <button id="btnExcluirMetaModal" class="modalDeleteBtn compactDanger" type="button" onclick="excluirMetaEmEdicao()">Excluir</button>
      <button class="cancel" onclick="fecharModal()">Cancelar</button>
      <button class="save" onclick="salvarMeta()">Salvar</button>
    </div>
  </div>
</div>

<div class="modalOverlay" id="modalFuturasEdicoes">
  <div class="modal">
    <h2 class="modalTitle">Futuras edições</h2>

    <div class="field">
      <label>Ideias de melhorias futuras</label>
      <textarea id="futurasEdicoesTexto" placeholder="Escreva aqui suas ideias para melhorar essa tela..."></textarea>
    </div>

    <div class="modalBtns">
      <button class="cancel" onclick="fecharModalFuturasEdicoes()">Cancelar</button>
      <button class="save" onclick="salvarFuturasEdicoes()">Concluir</button>
    </div>
  </div>
</div>

<script>
const CHAVE_METAS = "metasGabriela";
const CHAVE_OBJETIVOS = "objetivosGabriela";
const CHAVE_FUTURAS_EDICOES_METAS = "futuras_edicoes_metas";

function voltarPagina(){
  const params = new URLSearchParams(window.location.search);
  const from = params.get("from");

  if(from === "index"){
    location.href = "index.html";
  } else {
    location.href = "index.html";
  }
}

function ler(){
  return JSON.parse(localStorage.getItem(CHAVE_METAS)) || [];
}

function salvar(lista){
  localStorage.setItem(CHAVE_METAS, JSON.stringify(lista));
}

function lerObjetivos(){
  return JSON.parse(localStorage.getItem(CHAVE_OBJETIVOS)) || [];
}

function salvarObjetivos(lista){
  localStorage.setItem(CHAVE_OBJETIVOS, JSON.stringify(lista));
}

function atualizarSelectObjetivos(valorSelecionado = ""){
  const select = document.getElementById("campoMetaObjetivo");
  const objetivos = lerObjetivos();
  select.innerHTML = '<option value="">Sem objetivo</option>';
  objetivos.forEach(obj => {
    const option = document.createElement("option");
    option.value = obj.id;
    option.textContent = obj.nome;
    select.appendChild(option);
  });
  select.value = valorSelecionado || "";
}

function abrirModalObjetivo(){
  document.getElementById("campoObjetivoIdEdicao").value = "";
  document.getElementById("tituloModalObjetivo").textContent = "Novo objetivo";
  document.getElementById("campoObjetivoEmoji").value = "🎯";
  document.getElementById("campoObjetivoNome").value = "";
  document.getElementById("campoObjetivoDescricao").value = "";
  document.getElementById("campoObjetivoLocal").value = "";
  document.getElementById("campoObjetivoData").value = "";
  document.getElementById("campoObjetivoValor").value = "";
  document.getElementById("btnExcluirObjetivoModal").classList.remove("show");
  document.getElementById("modalObjetivo").classList.add("show");
}

function abrirModalEditarObjetivo(id){
  const obj = lerObjetivos().find(o => o.id === id);
  if(!obj) return;
  document.getElementById("campoObjetivoIdEdicao").value = obj.id;
  document.getElementById("tituloModalObjetivo").textContent = "Editar objetivo";
  document.getElementById("campoObjetivoEmoji").value = obj.emoji || "🎯";
  document.getElementById("campoObjetivoNome").value = obj.nome || "";
  document.getElementById("campoObjetivoDescricao").value = obj.descricao || "";
  document.getElementById("campoObjetivoLocal").value = obj.local || "";
  document.getElementById("campoObjetivoData").value = obj.data || "";
  document.getElementById("campoObjetivoValor").value = obj.valor ? formatarMoeda(obj.valor) : "";
  document.getElementById("btnExcluirObjetivoModal").classList.add("show");
  document.getElementById("modalObjetivo").classList.add("show");
}

function fecharModalObjetivo(){ document.getElementById("modalObjetivo").classList.remove("show"); }

function salvarObjetivo(){
  const id = document.getElementById("campoObjetivoIdEdicao").value;
  const nome = document.getElementById("campoObjetivoNome").value.trim();
  if(!nome){ alert("Preencha o campo Objetivo."); return; }
  const dados = {
    emoji:document.getElementById("campoObjetivoEmoji").value || "🎯",
    nome,
    descricao:document.getElementById("campoObjetivoDescricao").value.trim(),
    local:document.getElementById("campoObjetivoLocal").value.trim(),
    data:document.getElementById("campoObjetivoData").value,
    valor:extrairNumeroMoeda(document.getElementById("campoObjetivoValor").value.trim())
  };
  const lista = lerObjetivos();
  if(id){ Object.assign(lista.find(o => o.id === id) || {}, dados); }
  else { lista.push({id:gerarId(), ...dados}); }
  salvarObjetivos(lista);
  fecharModalObjetivo();
  render();
}

function excluirObjetivo(id){
  if(!confirm("Excluir este objetivo? As metas vinculadas ficarão sem objetivo.")) return;
  salvarObjetivos(lerObjetivos().filter(o => o.id !== id));
  const metas = ler().map(m => m.objetivoId === id ? {...m, objetivoId:""} : m);
  salvar(metas);
  render();
}

function excluirObjetivoEmEdicao(){
  const id = document.getElementById("campoObjetivoIdEdicao").value;
  if(!id) return;
  if(!confirm("Excluir este objetivo? As metas vinculadas ficarão sem objetivo.")) return;
  salvarObjetivos(lerObjetivos().filter(o => o.id !== id));
  salvar(ler().map(m => m.objetivoId === id ? {...m, objetivoId:""} : m));
  fecharModalObjetivo();
  render();
}

function gerarId(){
  return "id_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
}

function formatarMoeda(numero) {
  return Number(numero || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function mascaraMoeda(input) {
  let valor = input.value.replace(/\D/g, "");
  valor = (Number(valor) / 100).toFixed(2) + "";
  valor = valor.replace(".", ",");
  valor = valor.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  input.value = "R$ " + valor;
}

function extrairNumeroMoeda(texto) {
  if (!texto) return 0;
  return Number(
    texto.replace(/[R$\s.]/g, "").replace(",", ".")
  ) || 0;
}

function formatarData(dataISO) {
  if (!dataISO) return "—";
  const [ano, mes, dia] = dataISO.split("-");
  if (!ano || !mes || !dia) return "—";
  return `${dia}/${mes}/${ano}`;
}

function dataHojeISO(){
  const agora = new Date();
  const ano = agora.getFullYear();
  const mes = String(agora.getMonth() + 1).padStart(2, "0");
  const dia = String(agora.getDate()).padStart(2, "0");
  return `${ano}-${mes}-${dia}`;
}

function abrirModal(){
  document.getElementById("campoMetaIdEdicao").value = "";
  document.getElementById("tituloModalMeta").textContent = "Nova meta";
  document.getElementById("campoMetaNome").value = "";
  document.getElementById("campoMetaDescricao").value = "";
  document.getElementById("campoMetaLocal").value = "";
  document.getElementById("campoMetaData").value = "";
  document.getElementById("campoMetaValor").value = "";
  atualizarSelectObjetivos("");
  document.getElementById("btnExcluirMetaModal").classList.remove("show");
  const btnConcluir = document.getElementById("btnConcluirMetaModal");
  btnConcluir.classList.remove("show", "reabrir");
  btnConcluir.textContent = "Concluir";
  document.getElementById("modalMeta").classList.add("show");
}

function abrirModalEditar(id){
  const lista = ler();
  const meta = lista.find(m => m.id === id);
  if(!meta) return;

  document.getElementById("campoMetaIdEdicao").value = meta.id;
  document.getElementById("tituloModalMeta").textContent = "Editar meta";
  document.getElementById("campoMetaNome").value = meta.nome || "";
  document.getElementById("campoMetaDescricao").value = meta.descricao || "";
  document.getElementById("campoMetaLocal").value = meta.local || "";
  document.getElementById("campoMetaData").value = meta.data || "";
  document.getElementById("campoMetaValor").value = meta.valor ? formatarMoeda(meta.valor) : "";
  atualizarSelectObjetivos(meta.objetivoId || "");
  document.getElementById("btnExcluirMetaModal").classList.add("show");
  const btnConcluir = document.getElementById("btnConcluirMetaModal");
  btnConcluir.classList.add("show");
  btnConcluir.classList.toggle("reabrir", !!meta.realizada);
  btnConcluir.textContent = meta.realizada ? "Reabrir" : "Concluir";
  document.getElementById("modalMeta").classList.add("show");
}

function fecharModal(){
  document.getElementById("modalMeta").classList.remove("show");
}

function salvarMeta(){
  const idEdicao = document.getElementById("campoMetaIdEdicao").value;
  const nome = document.getElementById("campoMetaNome").value.trim();
  const descricao = document.getElementById("campoMetaDescricao").value.trim();
  const local = document.getElementById("campoMetaLocal").value.trim();
  const data = document.getElementById("campoMetaData").value;
  const valor = extrairNumeroMoeda(document.getElementById("campoMetaValor").value.trim());
  const objetivoId = document.getElementById("campoMetaObjetivo").value;

  if(!nome){
    alert("Preencha o campo Meta.");
    return;
  }

  const lista = ler();

  if(idEdicao){
    const meta = lista.find(m => m.id === idEdicao);
    if(meta){
      meta.nome = nome;
      meta.descricao = descricao;
      meta.local = local;
      meta.data = data;
      meta.valor = valor;
      meta.objetivoId = objetivoId;
    }
  } else {
    lista.push({
      id:gerarId(),
      nome,
      descricao,
      local,
      data,
      valor,
      objetivoId,
      realizada:false,
      dataRealizada:""
    });
  }

  salvar(lista);
  fecharModal();
  render();
}

function excluir(id){
  let lista = ler();
  lista = lista.filter(m => m.id !== id);
  salvar(lista);
  render();
}

function alternarConclusaoMetaEmEdicao(){
  const id = document.getElementById("campoMetaIdEdicao").value;
  if(!id) return;
  const lista = ler();
  const meta = lista.find(m => m.id === id);
  if(!meta) return;
  meta.realizada = !meta.realizada;
  meta.dataRealizada = meta.realizada ? dataHojeISO() : "";
  salvar(lista);
  fecharModal();
  render();
}

function excluirMetaEmEdicao(){
  const id = document.getElementById("campoMetaIdEdicao").value;
  if(!id) return;
  if(!confirm("Excluir esta meta?")) return;
  salvar(ler().filter(m => m.id !== id));
  fecharModal();
  render();
}


function realizar(id){
  const lista = ler();
  const meta = lista.find(m => m.id === id);
  if(meta){
    meta.realizada = true;
    meta.dataRealizada = dataHojeISO();
  }
  salvar(lista);
  render();
}

function reabrirMeta(id){
  const lista = ler();
  const meta = lista.find(m => m.id === id);
  if(meta){
    meta.realizada = false;
    meta.dataRealizada = "";
  }
  salvar(lista);
  render();
}

function montarResumoMeta(meta, realizada){
  const div = document.createElement("div");
  div.className = "metaItem";

  const descricao = meta.descricao ? meta.descricao : "—";
  const resumoInfo = [
    meta.local || "",
    meta.data ? `Até ${formatarData(meta.data)}` : ""
  ].filter(Boolean).join(" • ");

  div.innerHTML = `
    <div class="metaNome" style="text-align:left;">
      ${meta.nome}${realizada ? ' <span class="metaConcluidaTag">(Concluída)</span>' : ''}
    </div>

    <div class="metaDescricaoLinhaWrap">
      <div class="metaDescricaoLinha">
        <strong>Descrição:</strong> ${descricao}
      </div>
      <div class="metaActions">
        <button class="actionBtn">Editar</button>
      </div>
    </div>

    ${resumoInfo ? `<div class="metaResumoInfo">${resumoInfo}</div>` : ''}
    ${realizada ? `<div class="metaResumoExtra"><strong>Concluída em:</strong> ${meta.dataRealizada ? formatarData(meta.dataRealizada) : '—'}</div>` : ''}
  `;

  const actions = div.querySelector(".metaActions");

  div.onclick = () => {
    document.querySelectorAll(".metaActions.show").forEach(el => {
      if(el !== actions) el.classList.remove("show");
    });
    actions.classList.toggle("show");
  };

  actions.children[0].onclick = (e)=>{
    e.stopPropagation();
    abrirModalEditar(meta.id);
  };

  return div;
}

function criarCardPendente(meta){
  return montarResumoMeta(meta, false);
}

function criarCardRealizada(meta){
  return montarResumoMeta(meta, true);
}

function criarCardObjetivo(objetivo, metasVinculadas){
  const div = document.createElement("div");
  div.className = "objetivoItem";

  const pendentes = metasVinculadas.filter(m => !m.realizada);
  const realizadas = metasVinculadas.filter(m => m.realizada);

  const resumoInfo = [
    objetivo.local || "",
    objetivo.data ? `Até ${formatarData(objetivo.data)}` : ""
  ].filter(Boolean).join(" • ");

  const metasHtml = metasVinculadas.length
    ? metasVinculadas.map(m => {
        const metaResumoInfo = [
          m.local || "",
          m.data ? `Até ${formatarData(m.data)}` : ""
        ].filter(Boolean).join(" • ");
        return `
        <div class="objetivoMetaMini" data-meta-card="${m.id}">
          <div class="objetivoMetaMiniResumo">
            <div class="objetivoMetaNome">${m.realizada ? '✓ ' : '○ '}${m.nome}${m.realizada ? ' <span class="metaConcluidaTag">(Concluída)</span>' : ''}</div>
            <div class="objetivoMetaDescricaoLinhaWrap">
              <div class="objetivoMetaMiniDescricao">${m.descricao || '—'}</div>
              <div class="objetivoMetaEditarWrap">
                <button class="objetivoMetaEditar" data-meta-editar="${m.id}">Editar</button>
              </div>
            </div>
            ${metaResumoInfo ? `<div class="objetivoMetaMiniInfo">${metaResumoInfo}</div>` : ''}
            ${m.realizada && m.dataRealizada ? `<div class="objetivoMetaMiniInfo"><strong>Concluída em:</strong> ${formatarData(m.dataRealizada)}</div>` : ''}
          </div>
        </div>`;
      }).join("")
    : '<div class="empty">Nenhuma meta vinculada a este objetivo.</div>';

  div.innerHTML = `
    <div class="objetivoResumo">
      <div class="objetivoEmojiVisual">${objetivo.emoji || "🎯"}</div>
      <div>
        <div class="objetivoNome">${objetivo.nome}</div>
        <div class="objetivoDescricao">${objetivo.descricao || "Toque para visualizar as metas vinculadas."}</div>
        ${resumoInfo ? `<div class="objetivoResumoInfoLinha"><div class="objetivoResumoInfo">${resumoInfo}</div><button class="editarObjetivoInline" type="button">Editar</button></div>` : `<div class="objetivoResumoInfoLinha"><div class="objetivoResumoInfo"></div><button class="editarObjetivoInline" type="button">Editar</button></div>`}
      </div>
      <div class="objetivoSeta">›</div>
    </div>
    <div class="objetivoConteudo">
      <div class="objetivoMetasTitulo">Metas desse objetivo</div>
      <div class="objetivoMetas">${metasHtml}</div>
      <div class="objetivoInfo">${pendentes.length} pendente(s) • ${realizadas.length} realizada(s)</div>
    </div>`;

  div.querySelector(".objetivoResumo").onclick = () => div.classList.toggle("aberto");

  div.querySelectorAll(".objetivoMetaMini").forEach(cardMeta => {
    cardMeta.onclick = (e) => {
      if(e.target.closest('.objetivoMetaEditar')) return;
      div.querySelectorAll('.objetivoMetaMini.aberto').forEach(el => {
        if(el !== cardMeta) el.classList.remove('aberto');
      });
      cardMeta.classList.toggle('aberto');
    };
  });

  div.querySelectorAll(".objetivoMetaEditar").forEach(botao => {
    botao.onclick = e => {
      e.stopPropagation();
      abrirModalEditar(botao.dataset.metaEditar);
    };
  });

  const botaoEditarObjetivo = div.querySelector(".editarObjetivoInline");
  botaoEditarObjetivo.onclick = e => {
    e.stopPropagation();
    abrirModalEditarObjetivo(objetivo.id);
  };
  return div;
}

function render(){
  const lista = ler();
  const objetivos = lerObjetivos();
  const semObjetivo = lista.filter(m => !m.realizada && !m.objetivoId);

  const listaObjetivos = document.getElementById("listaObjetivos");
  const c1 = document.getElementById("listaMetas");
  const boxSemObjetivo = document.getElementById("boxMetasSemObjetivo");

  listaObjetivos.innerHTML = "";
  c1.innerHTML = "";

  if(!objetivos.length){
    listaObjetivos.innerHTML = `<div class="empty">Nenhum objetivo cadastrado ainda.</div>`;
  } else {
    objetivos.forEach(obj => listaObjetivos.appendChild(criarCardObjetivo(obj, lista.filter(m => m.objetivoId === obj.id))));
  }

  boxSemObjetivo.style.display = semObjetivo.length ? "block" : "none";
  semObjetivo.forEach(m => c1.appendChild(criarCardPendente(m)));
  atualizarSelectObjetivos(document.getElementById("campoMetaObjetivo")?.value || "");
}

function abrirModalFuturasEdicoes(){
  document.getElementById("futurasEdicoesTexto").value =
    localStorage.getItem(CHAVE_FUTURAS_EDICOES_METAS) || "";
  document.getElementById("modalFuturasEdicoes").classList.add("show");
}

function fecharModalFuturasEdicoes(){
  document.getElementById("modalFuturasEdicoes").classList.remove("show");
}

function salvarFuturasEdicoes(){
  localStorage.setItem(
    CHAVE_FUTURAS_EDICOES_METAS,
    document.getElementById("futurasEdicoesTexto").value
  );
  fecharModalFuturasEdicoes();
}

function pad2(numero){
  return String(numero).padStart(2, "0");
}

function atualizarLinhaTempo(){
  const agora = new Date();
  const diasCurtos = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];

  document.getElementById("linhaTempoHora").textContent = `${pad2(agora.getHours())}:${pad2(agora.getMinutes())}`;
  document.getElementById("linhaTempoDia").textContent = `• ${diasCurtos[agora.getDay()]}`;
  document.getElementById("linhaTempoData").textContent = `• ${pad2(agora.getDate())}/${pad2(agora.getMonth()+1)}`;
}

document.getElementById("campoMetaValor").addEventListener("input", function() {
  mascaraMoeda(this);
});
document.getElementById("campoObjetivoValor").addEventListener("input", function() {
  mascaraMoeda(this);
});

window.addEventListener("load", () => {
  atualizarLinhaTempo();
  setInterval(atualizarLinhaTempo, 1000);
});

render();
</script>

</body>
</html>
